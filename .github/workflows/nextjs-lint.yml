name: Next.js Lint

on:
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-lint.yml"
  pull_request:
    paths:
      - "nextjs/**"
      - ".github/workflows/nextjs-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      - name: Lint
        working-directory: nextjs
        run: npm run lint

      - name: Validate OpenAPI spec
        working-directory: nextjs
        run: npx @redocly/cli lint public/duolingo.yaml

      - name: Build
        working-directory: nextjs
        # No DUOLINGO_JWT_TOKEN secret needed: app/feed/page.tsx is force-dynamic, so
        # Next.js never attempts the live Duolingo fetch at build time (verified locally
        # with the var unset before adding this step).
        run: npm run build

      - name: Build Docker image
        working-directory: nextjs
        run: docker build -t luodingo-nextjs:ci .
